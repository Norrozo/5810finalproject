# I4: B0 + ProPainter inpainting (third_party/ProPainter, own env .venv-propainter).
# Compared against B0 and I3b. Masks reused from B0. Everything else identical to B0.
version: I4

data_root: data
runs_root: runs
results_csv: results/results.csv
eval_clips: configs/eval_clips.txt

# Clip limits (keep small for Colab's free GPU)
max_frames: 60
max_height: 480

segmentation:
  method: sam2              # sam2 | oracle (oracle copies ground-truth masks; for debugging/ablations)
  hf_model: facebook/sam2.1-hiera-large
  offload_video_to_cpu: true
  reuse_from: B0            # same SAM 2 settings as B0, so reuse its masks

refine:
  threshold: 127            # B0 only binarizes. No dilation or hole filling yet.

inpaint:
  method: propainter        # opencv | flow_guided | propainter
  mask_dilation: 4          # ProPainter's default; part of the published method
  neighbor_length: 10       # ProPainter defaults below
  ref_stride: 10
  subvideo_length: 20        # default 80 swaps on a 16 GB Mac (>10 min/clip); 20 = ~2 min/clip
  fp16: true                # 4x faster on MPS; same quality (20.38 vs 20.44 dB PSNR mask, dog frame 5)

evaluation:
  boundary_tolerance: 0.008 # fraction of image diagonal, as in DAVIS
  region_dilation: 5        # px added around the GT mask when scoring the filled region

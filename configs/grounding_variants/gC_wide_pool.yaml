# Grounding variant for the real DEV set only (I2 with 0.2 threshold, no re-rank). Scored by src/eval_grounding.py.
version: gC_wide_pool
data_root: data
runs_root: runs
results_csv: results/results.csv
eval_clips: configs/eval_clips.txt
max_frames: 60
grounding:
  method: grounding_dino
  hf_model: IDEA-Research/grounding-dino-tiny
  box_threshold: 0.2
  text_threshold: 0.25
  prompts_file: configs/eval_prompts.txt
max_height: 480
segmentation:
  method: sam2
  hf_model: facebook/sam2.1-hiera-large
  offload_video_to_cpu: true
refine:
  threshold: 127
inpaint:
  method: opencv
  opencv_method: telea
  radius: 5
evaluation:
  boundary_tolerance: 0.008
  region_dilation: 5

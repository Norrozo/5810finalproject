# I2c: I2 + ask-when-ambiguous. Grounding keeps the top 3 boxes (pool threshold 0.2); if the
# runner-up scores >= 0.7 x the best, the user picks one with a click (demo). On the benchmark
# a SIMULATED user picks the box on the true object. Ratio chosen on the real DEV set. Else = I2.
version: I2c

data_root: data
runs_root: runs
results_csv: results/results.csv
eval_clips: configs/eval_clips.txt

# Clip limits (keep small for Colab's free GPU)
max_frames: 60

grounding:
  method: grounding_dino
  hf_model: IDEA-Research/grounding-dino-tiny
  box_threshold: 0.2        # wider pool so the right object is among the choices (I2: 0.35)
  text_threshold: 0.25
  prompts_file: configs/eval_prompts.txt
  disambiguate:
    ratio: 0.7              # runner-up >= 0.7 x best -> ask (chosen on real dev set)
    max_choices: 3
    simulate_user: true     # benchmark only: picks the choice on the true object
max_height: 480

segmentation:
  method: sam2              # sam2 | oracle (oracle copies ground-truth masks; for debugging/ablations)
  hf_model: facebook/sam2.1-hiera-large
  offload_video_to_cpu: true

refine:
  threshold: 127            # B0 only binarizes. No dilation or hole filling yet.

inpaint:
  method: opencv            # opencv | flow_guided (I3) | propainter (I4)
  opencv_method: telea      # telea | ns
  radius: 5

evaluation:
  boundary_tolerance: 0.008 # fraction of image diagonal, as in DAVIS
  region_dilation: 5        # px added around the GT mask when scoring the filled region

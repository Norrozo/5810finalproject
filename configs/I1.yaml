# I1: B0 + mask refinement (drop specks, fill holes, dilate). Everything else identical to B0.
version: I1

data_root: data
runs_root: runs
results_csv: results/results.csv
eval_clips: configs/eval_clips.txt

# Clip limits (keep small for Colab's free GPU)
max_frames: 60
max_height: 480

segmentation:
  method: sam2              # sam2 | oracle (oracle copies ground-truth masks; for debugging/ablations)
  hf_model: facebook/sam2.1-hiera-large
  offload_video_to_cpu: true
  reuse_from: B0            # same SAM 2 settings as B0, so reuse its masks

refine:
  threshold: 127
  min_blob_area: 100        # px; drop tiny disconnected specks
  fill_holes: true          # fill holes fully enclosed by the mask
  dilate_px: 5              # grow the mask 5 px so edge halos get inpainted too

inpaint:
  method: opencv            # opencv | flow_guided (I3, not implemented) | propainter (I4, not implemented)
  opencv_method: telea      # telea | ns
  radius: 5

evaluation:
  boundary_tolerance: 0.008 # fraction of image diagonal, as in DAVIS
  region_dilation: 5        # px added around the GT mask when scoring the filled region
